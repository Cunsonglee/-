name: Daily Visa Scraper

on:
schedule:
    # 每天 UTC 时间 5:00 和 12:00 运行
    # 对应西班牙时间 (CEST, UTC+2) 为 07:00 和 14:00
    - cron: '0 5,12 * * *'
  workflow_dispatch:      # 依然保留手动触发功能

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 cloudscraper lxml pandas

      - name: Run scraper
        run: python main.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add visa_data.json
          git commit -m "Auto-update visa data" || exit 0
          git push
