name: Daily Visa Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a las 00:00 UTC
  workflow_dispatch: # Permite que lo ejecutes manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper lxml pandas
          # Agrega aquí cualquier otra librería que use tu main.py

      - name: Ejecutar Scraper
        run: |
          cd News
          python main.py --days 3
        # El comando 'cd News' es vital para que GitHub encuentre el archivo

      - name: Guardar cambios en el JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add News/visa_data.json
          git commit -m "Actualización automática de noticias [Skip CI]" || echo "No hay cambios para confirmar"
          git push
