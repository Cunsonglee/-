name: Daily Visa Scraper

on:
  schedule:
    # 覆盖夏令时 (UTC+2) 和 冬令时 (UTC+1) 的 7:00 和 14:00
    - cron: '0 5,6,12,13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper pandas deep-translator streamlit-antd-components lxml
        # run: pip install requests beautifulsoup4 cloudscraper pandas deep-translator streamlit-antd-components


      - name: Run scraper
        run: python main.py




      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add visa_data.json
          git commit -m "Auto-update visa data" || exit 0
          git push
